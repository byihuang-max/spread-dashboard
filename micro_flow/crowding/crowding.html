<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行业拥挤度监控</title>
<style>
:root{--bg:#f5f6f8;--card-bg:#fff;--text:#2d3142;--text-sub:#8b92a5;--border:#e8eaef;--accent:#ff8c00}
html.bb-dark{--bg:#0a0a0a;--card-bg:#0a0a0a;--text:#ccc;--text-sub:#888;--border:#2a2a2a;--accent:#ff8c00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',SF Mono,monospace;background:var(--bg);color:var(--text);padding:0;font-size:14px}
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--card-bg);position:sticky;top:0;z-index:10}
.sub-tab{padding:12px 20px;font-size:13px;font-weight:700;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.sub-tab:hover{color:var(--text)}
.sub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sub-page{display:none;width:100%;height:calc(100vh - 46px)}
.sub-page.active{display:block}
.sub-page iframe{width:100%;height:100%;border:none}
</style>
<script>
(function(){
  var _m="dark";try{_m=window.parent.__bbMode||window.parent.localStorage.getItem("bbMode")||"dark";}catch(e){}
  window.__bbMode=_m;if(_m!=="light"){document.documentElement.classList.add("bb-dark");}
  window.addEventListener("message",function(e){if(!e.data||e.data.type!=="bb-theme")return;var m=e.data.mode;window.__bbMode=m;if(m==="light")document.documentElement.classList.remove("bb-dark");else document.documentElement.classList.add("bb-dark");
    // 转发给子iframe
    document.querySelectorAll('iframe').forEach(function(f){try{f.contentWindow.postMessage(e.data,'*');}catch(_){}});
  });
})();
</script>
</head>
<body>
<div class="sub-tabs">
  <div class="sub-tab active" data-page="heatmap">行业拥挤度</div>
  <div class="sub-tab" data-page="chain">产业链景气</div>
</div>
<div class="sub-page active" id="page-heatmap">
  <iframe src="industry_heatmap.html"></iframe>
</div>
<div class="sub-page" id="page-chain">
  <iframe src="../../meso/chain_prosperity/chain_prosperity.html"></iframe>
</div>

<script>
document.querySelectorAll('.sub-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.sub-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.sub-page').forEach(function(p){p.classList.remove('active')});
    tab.classList.add('active');
    document.getElementById('page-'+tab.getAttribute('data-page')).classList.add('active');
  });
});
</script>
</body></html>
