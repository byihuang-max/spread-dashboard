<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期权异常值监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#2d3142;padding:20px;font-size:14px}
h2{font-size:16px;font-weight:700;margin-bottom:12px;color:#1e2433}
.section{margin-bottom:28px}

/* 标的选择器 */
.und-tabs{display:flex;gap:8px;margin-bottom:20px}
.und-tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;border:1px solid #e8eaef;color:#6b7280;transition:all .15s}
.und-tab.active{background:#1e2433;color:#fff;border-color:#1e2433}
.und-tab:hover:not(.active){border-color:#6366f1;color:#6366f1}

/* 摘要卡片 */
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.s-card{background:#fff;border-radius:10px;padding:14px;border:1px solid #e8eaef;text-align:center}
.s-card .s-label{font-size:11px;color:#8b92a5;font-weight:600;margin-bottom:6px}
.s-card .s-value{font-size:22px;font-weight:800}
.s-card .s-sub{font-size:11px;color:#8b92a5;margin-top:4px}

/* 图表 */
.chart-box{background:#fff;border-radius:10px;padding:16px;border:1px solid #e8eaef;margin-bottom:16px}
.chart-box h3{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px}
.chart-wrap{position:relative;height:260px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}}

/* 异常表格 */
.anomaly-table{width:100%;border-collapse:collapse;font-size:12px}
.anomaly-table th{background:#f9fafb;padding:8px 10px;text-align:left;font-weight:700;color:#374151;border-bottom:2px solid #e5e7eb}
.anomaly-table td{padding:8px 10px;border-bottom:1px solid #f3f4f6}
.anomaly-table tr:hover{background:#f9fafb}
.tag-oi{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.tag-iv{background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}

/* IV分位条 */
.pct-bar{height:8px;border-radius:4px;background:#e5e7eb;position:relative;margin-top:4px}
.pct-fill{height:100%;border-radius:4px;position:absolute;left:0;top:0}

/* 图表下方注释 */
.chart-note{font-size:11px;color:#8b92a5;line-height:1.7;margin-top:10px;padding:10px 12px;background:#f9fafb;border-radius:6px}
.chart-note b{color:#374151}

.loading{text-align:center;padding:60px;color:#8b92a5}

/* 信号栏 */
.signal-bar{background:linear-gradient(135deg,#1e2433,#2a3350);border-radius:12px;padding:16px 20px;color:#e2e6ed;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.signal-main{font-size:18px;font-weight:800;letter-spacing:1px;white-space:nowrap}
.signal-tags{display:flex;gap:8px;flex-wrap:wrap}
.signal-tag{background:rgba(255,255,255,0.1);padding:4px 12px;border-radius:20px;font-size:12px;color:#b8bfce}
.signal-tag.warn{background:rgba(245,158,11,0.25);color:#fbbf24}
.signal-tag.good{background:rgba(34,197,94,0.2);color:#4ade80}
.signal-tag.risk{background:rgba(239,68,68,0.2);color:#f87171}
.signal-tag.info{background:rgba(99,102,241,0.2);color:#a5b4fc}
</style>
<style id="bb-override" media="not all">
/* === BLOOMBERG TERMINAL OVERRIDE === */
[style*="animation"],[class*="fade"],[class*="slide"]{opacity:1!important;transform:none!important}canvas{opacity:1!important}
:root{--bg:#0a0a0a!important;--card-bg:#0a0a0a!important;--card:#0a0a0a!important;--text:#ccc!important;--text-sub:#888!important;--border:#2a2a2a!important;--accent:#ff8c00!important;--sidebar-active:#ff8c00!important}
html,body{background:#0a0a0a!important;color:#ccc!important;max-width:100%!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
.card,.panel,.module-card,.diag-hero,.metric-card,.factor-card,.info-card,.method-card,.legend-card,.stat-card,.overview-card,.ov-card{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;box-shadow:none!important;color:#ccc!important}
.card-title,.panel-title,.section-title,.module-title,h1,h2,h3,h4,h5,h6,.ov-label{color:#ff8c00!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
p,span,div,li,td,th,label,.ov-value,.stat-value,.metric-value{color:#ccc!important}
table{border-collapse:collapse!important}
table,th,td{border-color:#2a2a2a!important;color:#ccc!important}
th{background:#111!important;color:#ff8c00!important}
tr:nth-child(even) td{background:#0f0f0f!important}
tr:hover td{background:#1a1a1a!important}
button,.btn,.refresh-btn,.tab,.ss-tab,.strat-tab,.nav-tab{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
button:hover,.btn:hover,.tab.active,.ss-tab.active,.strat-tab.active,.nav-tab.active{background:#ff8c00!important;color:#000!important;border-color:#ff8c00!important}
.dot{display:none!important}
canvas{background:transparent!important}
input,select,textarea{background:#1a1a1a!important;border:1px solid #333!important;color:#ccc!important;border-radius:0!important}
a{color:#ff8c00!important}
hr{border-color:#2a2a2a!important}
code,pre{background:#111!important;color:#4caf50!important;border-color:#2a2a2a!important}
.badge,.tag,.chip,.label-tag{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:0}
/* === option_sentiment page-specific === */
h2,h3{color:#ff8c00!important;letter-spacing:.5px}
.signal-bar{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;color:#ccc!important}
.signal-main{color:#ff8c00!important}
.signal-tag{background:#1a1a1a!important;color:#888!important;border:1px solid #333!important;border-radius:0!important;padding:3px 10px!important}
.signal-tag.warn{background:#1a1a1a!important;color:#ff8c00!important;border-color:#ff8c00!important}
.signal-tag.good{background:#1a1a1a!important;color:#16a34a!important;border-color:#16a34a!important}
.signal-tag.risk{background:#1a1a1a!important;color:#ef4444!important;border-color:#ef4444!important}
.signal-tag.info{background:#1a1a1a!important;color:#a5b4fc!important;border-color:#3a3a4a!important}
.und-tab{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
.und-tab:hover:not(.active){border-color:#ff8c00!important;color:#ff8c00!important}
.und-tab.active{background:#ff8c00!important;color:#000!important;border-color:#ff8c00!important}
.s-card{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;color:#ccc!important}
.s-card .s-label{color:#888!important;text-transform:uppercase;letter-spacing:1px;font-size:10px!important}
.s-card .s-value{color:#ff8c00!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
.s-card .s-sub{color:#666!important}
.pct-bar{background:#1a1a1a!important;border-radius:0!important;border:1px solid #333!important;height:6px!important}
.pct-fill{border-radius:0!important}
.chart-box{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;color:#ccc!important}
.chart-box h3{color:#ff8c00!important}
.chart-note{background:#0f0f0f!important;color:#888!important;border:1px solid #2a2a2a!important;border-radius:0!important}
.chart-note b{color:#ccc!important}
.anomaly-table{font-family:'JetBrains Mono',SF Mono,monospace!important}
.anomaly-table th{background:#111!important;color:#ff8c00!important;border-bottom:1px solid #2a2a2a!important}
.anomaly-table td{border-bottom:1px solid #1a1a1a!important;color:#ccc!important}
.anomaly-table tr:hover td{background:#1a1a1a!important}
.tag-oi{background:#1a1a1a!important;color:#ff8c00!important;border:1px solid #ff8c00!important;border-radius:0!important}
.tag-iv{background:#1a1a1a!important;color:#a5b4fc!important;border:1px solid #3a3a4a!important;border-radius:0!important}
.loading{color:#666!important}
</style>




<script>
(function(){
  function isBloomberg(){
    try{return window.parent.location.search.includes("theme=bloomberg")}catch(e){return false}
  }
  function registerPlugin(){
    if(typeof Chart==="undefined")return false;
    if(!isBloomberg())return true;
    Chart.defaults.color="#888";
    Chart.defaults.borderColor="#2a2a2a";
    Chart.defaults.font.family="JetBrains Mono,SF Mono,monospace";
    Chart.defaults.plugins.legend.labels.color="#888";
    Chart.defaults.plugins.tooltip.backgroundColor="#1a1a1a";
    Chart.defaults.plugins.tooltip.borderColor="#333";
    Chart.register({
      id:"bloombergGrid",
      afterLayout(chart){
        Object.values(chart.scales).forEach(function(scale){
          if(scale.options.grid){
            if(scale.axis==="x"){
              scale.options.grid.display=false;
            }else{
              scale.options.grid.color="#2a2a2a";
              scale.options.grid.lineWidth=1;
              scale.options.grid.drawTicks=false;
              scale.options.grid.display=true;
            }
          }
          if(scale.options.ticks){
            scale.options.ticks.color="#888";
          }
        });
      }}
  });
}

function renderOIChart(u){
  destroyChart('oiChart');
  var oi=u.oi_distribution||[];
  if(!oi.length)return;
  var spot=u.summary.spot;
  // 只显示现价附近的行权价
  var filtered=oi.filter(function(d){return d.strike>=spot*0.9&&d.strike<=spot*1.1});
  if(!filtered.length) filtered=oi;
  charts['oiChart']=new Chart(document.getElementById('oiChart'),{
    type:'bar',
    data:{labels:filtered.map(function(d){return d.strike.toFixed(2)}),
      datasets:[
        {label:'Call OI',data:filtered.map(function(d){return d.call_oi}),backgroundColor:'#ef444488',borderColor:'#ef4444',borderWidth:1},
        {label:'Put OI',data:filtered.map(function(d){return -d.put_oi}),backgroundColor:'#22c55e88',borderColor:'#22c55e',borderWidth:1}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:11}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+Math.abs(ctx.raw).toLocaleString()}}}},
      scales:{x:{ticks:{font:{size:9},maxRotation:45}},y:{grid:{color:'#f0f0f0'},
        ticks:{callback:function(v){return Math.abs(v).toLocaleString()}}}}}
  });
}

function renderAnomalies(u){
  var tbody=document.querySelector('#anomalyTable tbody');
  var anomalies=u.anomalies||[];
  if(!anomalies.length){
    tbody.innerHTML='<tr><td colspan="3" style="text-align:center;color:#8b92a5;padding:20px">当前无异常信号 </td></tr>';
    return;
  }
  var html='';
  anomalies.forEach(function(a){
    var tag=a.type==='oi_surge'?'<span class="tag-oi">OI激增</span>':'<span class="tag-iv">IV异常</span>';
    html+='<tr><td>'+tag+'</td><td style="font-weight:700">'+a.label+'</td><td>'+a.detail+'</td></tr>';
  });
  tbody.innerHTML=html;
}

loadData();
</script>
</body></html>
