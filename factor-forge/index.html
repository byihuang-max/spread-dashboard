<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factor Forge · 因子蒸馏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6f8;--card:#fff;--text:#2d3142;--sub:#8b92a5;--border:#e8eaef;--accent:#2563eb;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ── 左栏 ── */
.sidebar{background:#1e2433;padding:0;display:flex;flex-direction:column}
.brand{padding:20px;font-size:15px;font-weight:700;color:#e2e6ed;border-bottom:1px solid rgba(255,255,255,.06)}
.brand em{color:var(--accent);font-style:normal}
.nav{padding:12px 0;flex:1}
.nav-item{padding:9px 20px;cursor:pointer;font-size:12px;color:#7c8598;border-left:2px solid transparent;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:rgba(255,255,255,.04);color:#b8bfce}
.nav-item.active{color:#e2e6ed;background:rgba(37,99,235,.08);border-left-color:var(--accent)}
.sidebar-footer{padding:14px 20px;font-size:11px;color:rgba(255,255,255,.2);border-top:1px solid rgba(255,255,255,.06)}

/* ── 主区 ── */
.main{display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:15px;font-weight:600}
.content{padding:20px 24px;flex:1}
.page{display:none}.page.active{display:block}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:6px}

/* ── 上传区 ── */
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:all .15s;background:var(--card)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:#f0f5ff}
.upload-zone .hint{color:var(--sub);font-size:13px;margin-top:8px}
.upload-zone input{display:none}
.btn{padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn-danger{color:var(--red)}.btn-danger:hover{border-color:var(--red);background:#fff5f5}
.btn-sm{padding:4px 10px;font-size:11px}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row label,.form-group label{font-size:11px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.form-group{margin-bottom:12px}

/* ── 进度/状态 ── */
.status-bar{background:#f0f5ff;border:1px solid #dbeafe;border-radius:8px;padding:12px 16px;font-size:12px;color:#1d4ed8;margin-bottom:16px;display:none}
.status-bar.error{background:#fff5f5;border-color:#fecaca;color:var(--red)}
.status-bar.success{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 因子卡片 ── */
.factor-list{display:flex;flex-direction:column;gap:12px}
.factor-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:box-shadow .15s}
.factor-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.factor-card.status-候选{border-left:3px solid var(--amber)}
.factor-card.status-已采纳{border-left:3px solid var(--green)}
.factor-card.status-已证伪{border-left:3px solid var(--red);opacity:.6}
.factor-card.status-观察中{border-left:3px solid var(--accent)}
.factor-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.factor-name{font-weight:700;font-size:15px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.tag-macro{background:#dbeafe;color:#1d4ed8}
.tag-industry{background:#d1fae5;color:#065f46}
.tag-stock{background:#fef3c7;color:#92400e}
.tag-看多{background:#dcfce7;color:#15803d}
.tag-看空{background:#fee2e2;color:#991b1b}
.tag-中性{background:#f1f5f9;color:#475569}
.tag-status{font-weight:700}
.tag-候选{background:#fef3c7;color:#92400e}
.tag-已采纳{background:#dcfce7;color:#15803d}
.tag-已证伪{background:#fee2e2;color:#991b1b}
.tag-观察中{background:#dbeafe;color:#1d4ed8}
.factor-field{margin-bottom:8px;font-size:12px;line-height:1.6}
.factor-field .fl{color:var(--sub);font-weight:600;min-width:72px;display:inline-block}
.factor-field .fv{color:var(--text)}
.observable-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px;color:#1d4ed8;margin:8px 0;line-height:1.7}
.advice-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:10px 12px;font-size:12px;color:#065f46;margin:8px 0;line-height:1.7}
.advice-box .advice-title{font-weight:700;margin-bottom:4px;color:#065f46}
.factor-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.confidence-stars{display:inline-flex;gap:2px}
.confidence-stars span{cursor:pointer;font-size:16px;color:#d1d5db;transition:color .1s}
.confidence-stars span.on{color:var(--amber)}

/* ── 行业索引 ── */
.industry-tree{display:flex;flex-direction:column;gap:10px}
.ind-group{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ind-header{padding:12px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#f8fafc}
.ind-header:hover{background:#f0f5ff}
.ind-items{display:none;border-top:1px solid var(--border)}
.ind-items.open{display:block}
.ind-item{padding:10px 16px 10px 28px;border-bottom:1px solid #f3f4f6;font-size:12px;cursor:pointer;transition:background .1s}
.ind-item:last-child{border-bottom:none}
.ind-item:hover{background:#f8fafc}
.ind-tickers{color:var(--sub);margin-top:3px;font-size:11px}

/* ── 过滤栏 ── */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{width:auto;flex:1;min-width:120px}

/* ── 空态 ── */
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty .em-icon{font-size:40px;margin-bottom:12px;opacity:.3}
</style>
</head><body>
<div class="shell">
<!-- 左栏 -->
<div class="sidebar">
  <div class="brand"><em>Factor</em> Forge</div>
  <nav class="nav">
    <div class="nav-item active" data-page="ingest">研报摄入</div>
    <div class="nav-item" data-page="factors">因子库</div>
    <div class="nav-item" data-page="industry">行业索引</div>
  </nav>
  <div class="sidebar-footer" id="sf">加载中...</div>
</div>

<!-- 主区 -->
<div class="main">
  <div class="header">
    <h1 id="pageTitle">研报摄入</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="loadFactors()">刷新</button>
    </div>
  </div>
  <div class="content">

  <!-- ══ 研报摄入 ══ -->
  <div class="page active" id="page-ingest">
    <div class="card">
      <div class="card-title">摄入研报</div>
      <div class="form-row">
        <div class="form-group">
          <label>来源机构 / 标题</label>
          <input type="text" id="inSource" placeholder="如：中信证券-半导体深度2026Q2">
        </div>
        <div class="form-group">
          <label>PDF 文件</label>
          <div class="upload-zone" id="dropzone" onclick="document.getElementById('pdfInput').click()">
            <div id="dropLabel">点击选择 PDF，或拖拽到此处</div>
            <div class="hint">支持单文件，研报不超过 200 页效果最佳</div>
            <input type="file" id="pdfInput" accept=".pdf" onchange="onFileSelect(this)">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>或直接粘贴正文（无 PDF 时使用）</label>
        <textarea id="inText" placeholder="粘贴研报正文..."></textarea>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label style="margin:0"><input type="checkbox" id="noAdvice" style="width:auto"> 跳过看板顾问（快速模式）</label>
      </div>
      <div id="ingestStatus" class="status-bar"></div>
      <button class="btn btn-primary" onclick="doIngest()">蒸馏因子</button>
    </div>

    <div id="ingestResult" style="display:none">
      <div class="card-title" style="margin-top:8px;font-size:13px;font-weight:600;color:var(--text)">蒸馏结果 <span id="resultCount" style="color:var(--sub);font-weight:400"></span></div>
      <div class="factor-list" id="ingestFactorList"></div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-primary" id="saveAllBtn" onclick="saveAll()">全部入库</button>
        <button class="btn" onclick="document.getElementById('ingestResult').style.display='none'">清空</button>
      </div>
    </div>
  </div>

  <!-- ══ 因子库 ══ -->
  <div class="page" id="page-factors">
    <div class="filter-bar">
      <select id="fLayer" onchange="renderFactors()">
        <option value="">全部层级</option>
        <option value="macro">宏观</option>
        <option value="industry">行业</option>
        <option value="stock">个股</option>
      </select>
      <select id="fStatus" onchange="renderFactors()">
        <option value="">全部状态</option>
        <option value="候选">候选</option>
        <option value="已采纳">已采纳</option>
        <option value="观察中">观察中</option>
        <option value="已证伪">已证伪</option>
      </select>
      <select id="fDir" onchange="renderFactors()">
        <option value="">全部方向</option>
        <option value="看多">看多</option>
        <option value="看空">看空</option>
        <option value="中性">中性</option>
      </select>
      <input type="text" id="fSearch" placeholder="搜索因子名/行业/个股..." oninput="renderFactors()" style="flex:2">
    </div>
    <div class="factor-list" id="factorList">
      <div class="empty"><div class="em-icon">◎</div>暂无因子，先摄入研报</div>
    </div>
  </div>

  <!-- ══ 行业索引 ══ -->
  <div class="page" id="page-industry">
    <div class="industry-tree" id="industryTree">
      <div class="empty"><div class="em-icon">◎</div>暂无数据</div>
    </div>
  </div>

  </div><!-- /content -->
</div><!-- /main -->
</div><!-- /shell -->

<script>
const API = '';

// ── 页面切换 ──────────────────────────
const TITLES = {'ingest':'研报摄入','factors':'因子库','industry':'行业索引'};
document.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    n.classList.add('active');
    const pg = n.dataset.page;
    document.getElementById('page-'+pg).classList.add('active');
    document.getElementById('pageTitle').textContent = TITLES[pg];
    if(pg==='factors') loadFactors();
    if(pg==='industry') loadIndustry();
  });
});

// ── 文件拖拽 ──────────────────────────
let selectedFile = null;
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag')});
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if(f && f.name.endsWith('.pdf')) setFile(f);
});
function onFileSelect(inp){ if(inp.files[0]) setFile(inp.files[0]); }
function setFile(f){
  selectedFile = f;
  document.getElementById('dropLabel').textContent = '已选: ' + f.name;
}

// ── 蒸馏 ──────────────────────────────
let pendingFactors = [];
async function doIngest(){
  const source = document.getElementById('inSource').value.trim();
  const text   = document.getElementById('inText').value.trim();
  const noAdv  = document.getElementById('noAdvice').checked;
  const st     = document.getElementById('ingestStatus');
  if(!selectedFile && !text){ showStatus(st,'请选择 PDF 或粘贴正文','error'); return; }

  showStatus(st,'<span class="spinner"></span>蒸馏中，请稍候（约 20-40 秒）...','');
  document.querySelector('#page-ingest .btn-primary').disabled = true;

  const fd = new FormData();
  if(selectedFile) fd.append('pdf', selectedFile);
  if(text) fd.append('text', text);
  if(source) fd.append('source', source);
  if(noAdv) fd.append('no_advice', '1');

  try {
    const r = await fetch(API+'/api/forge', {method:'POST', body:fd});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||r.status);
    pendingFactors = d.factors || [];
    showStatus(st, `蒸馏完成，得到 ${pendingFactors.length} 条因子候选`, 'success');
    renderIngestResult(pendingFactors);
  } catch(e){
    showStatus(st, '失败: ' + e.message, 'error');
  } finally {
    document.querySelector('#page-ingest .btn-primary').disabled = false;
  }
}

function showStatus(el, msg, type){
  el.innerHTML = msg;
  el.className = 'status-bar' + (type?' '+type:'');
  el.style.display = 'block';
}

// ── 渲染蒸馏结果 ──────────────────────
function renderIngestResult(factors){
  const wrap = document.getElementById('ingestResult');
  const list = document.getElementById('ingestFactorList');
  document.getElementById('resultCount').textContent = `(${factors.length} 条)`;
  list.innerHTML = factors.map((f,i) => factorCard(f, {editable:true, idx:i})).join('');
  wrap.style.display = factors.length ? 'block' : 'none';
  bindStars(list);
}

async function saveAll(){
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const r = await fetch(API+'/api/factors', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({factors:pendingFactors})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||r.status);
    alert(`入库成功：新增 ${d.added} 条，跳过重复 ${d.skipped} 条`);
    document.getElementById('ingestResult').style.display = 'none';
    pendingFactors = [];
  } catch(e){ alert('入库失败: ' + e.message); }
  finally { btn.disabled=false; btn.textContent='全部入库'; }
}

// ── 因子库 ──────────────────────────
let allFactors = [];
async function loadFactors(){
  try {
    const r = await fetch(API+'/api/factors');
    allFactors = await r.json();
    renderFactors();
    updateSidebarFooter();
  } catch(e){ document.getElementById('factorList').innerHTML = '<div class="empty">无法连接服务 ('+e.message+')</div>'; }
}

function renderFactors(){
  const layer  = document.getElementById('fLayer').value;
  const status = document.getElementById('fStatus').value;
  const dir    = document.getElementById('fDir').value;
  const kw     = document.getElementById('fSearch').value.toLowerCase();
  let fs = allFactors.filter(f => {
    if(layer  && f.layer      !== layer)  return false;
    if(status && f.status     !== status) return false;
    if(dir    && f.direction  !== dir)    return false;
    if(kw && !(
      (f.factor_name||'').toLowerCase().includes(kw) ||
      (f.linked_industry||'').toLowerCase().includes(kw) ||
      (f.source||'').toLowerCase().includes(kw) ||
      (f.linked_tickers||[]).join(',').toLowerCase().includes(kw)
    )) return false;
    return true;
  });
  const list = document.getElementById('factorList');
  list.innerHTML = fs.length
    ? fs.map(f => factorCard(f, {editable:false})).join('')
    : '<div class="empty"><div class="em-icon">◎</div>没有匹配的因子</div>';
  bindStars(list);
  bindActions(list);
}

// ── 行业索引 ──────────────────────────
async function loadIndustry(){
  const tree = document.getElementById('industryTree');
  if(!allFactors.length) await loadFactors();
  const byInd = {};
  allFactors.forEach(f=>{
    const ind = f.linked_industry || '未分类';
    (byInd[ind]=byInd[ind]||[]).push(f);
  });
  if(!Object.keys(byInd).length){ tree.innerHTML='<div class="empty"><div class="em-icon">◎</div>暂无数据</div>'; return; }
  tree.innerHTML = Object.entries(byInd).sort((a,b)=>b[1].length-a[1].length).map(([ind,facs])=>`
    <div class="ind-group">
      <div class="ind-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span>${ind} <span style="color:var(--sub);font-weight:400">(${facs.length})</span></span>
        <span style="font-size:11px;color:var(--sub)">▼</span>
      </div>
      <div class="ind-items">
        ${facs.map(f=>`
          <div class="ind-item">
            <div style="display:flex;align-items:center;gap:6px">
              <span class="tag tag-${f.direction}">${f.direction}</span>
              <b>${f.factor_name}</b>
              <span class="tag tag-status tag-${f.status||'候选'}">${f.status||'候选'}</span>
            </div>
            <div class="ind-tickers">${(f.linked_tickers||[]).join(' · ') || '暂无关联个股'}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:2px">${f.source||''}</div>
          </div>
        `).join('')}
      </div>
    </div>`).join('');
}

// ── 因子卡片渲染 ──────────────────────
function factorCard(f, {editable, idx}={}){
  const id = f.factor_id || '';
  const adv = f.dashboard_hook || {};
  const advHtml = (adv.dashboard_modules||[]).length ? `
    <div class="advice-box">
      <div class="advice-title">看板顾问建议</div>
      <div><b>挂靠模块：</b>${(adv.dashboard_modules||[]).join(' / ')}</div>
      ${adv.suggested_observables?.length ? '<div><b>建议观测：</b>' + adv.suggested_observables.join('；') + '</div>' : ''}
      ${adv.synergy_or_conflict ? '<div><b>与现有因子：</b>' + adv.synergy_or_conflict + '</div>' : ''}
      ${adv.adoption_value ? `<div><b>采纳价值：</b><span style="font-weight:700;color:${adv.adoption_value==='高'?'var(--green)':adv.adoption_value==='低'?'var(--sub)':'var(--amber)'}">${adv.adoption_value}</span> — ${adv.adoption_reason||''}</div>` : ''}
    </div>` : '';
  const stars = [1,2,3,4,5].map(n=>`<span data-n="${n}" class="${(f.confidence||0)>=n?'on':''}" title="${n}星">${(f.confidence||0)>=n?'★':'☆'}</span>`).join('');
  const actions = editable
    ? `<button class="btn btn-sm" onclick="approveIngest(${idx})">采纳</button>
       <button class="btn btn-sm btn-danger" onclick="removeIngest(${idx})">丢弃</button>`
    : `<select class="btn btn-sm" onchange="changeStatus('${id}',this.value)" style="border:1px solid var(--border)">
         ${['候选','已采纳','观察中','已证伪'].map(s=>`<option${s===(f.status||'候选')?' selected':''}>${s}</option>`).join('')}
       </select>
       <button class="btn btn-sm btn-danger" onclick="deleteFactor('${id}')">删除</button>`;
  return `<div class="factor-card status-${f.status||'候选'}" id="fc-${id||idx}">
    <div class="factor-head">
      <span class="tag tag-${f.layer}">${{macro:'宏观',industry:'行业',stock:'个股'}[f.layer]||f.layer}</span>
      <span class="factor-name">${f.factor_name||'未命名'}</span>
      <span class="tag tag-${f.direction}">${f.direction||'中性'}</span>
      <span class="tag tag-status tag-${f.status||'候选'}">${f.status||'候选'}</span>
      <span style="font-size:11px;color:var(--sub);margin-left:auto">${f.source||''}</span>
    </div>
    <div class="observable-box"><b>可观测信号：</b>${f.observable||'—'}</div>
    <div class="factor-field"><span class="fl">逻辑链：</span><span class="fv">${f.logic_chain||'—'}</span></div>
    <div class="factor-field"><span class="fl">触发条件：</span><span class="fv">${f.trigger||'—'}</span></div>
    <div class="factor-field"><span class="fl">证伪条件：</span><span class="fv">${f.invalidation||'—'}</span></div>
    <div class="factor-field">
      <span class="fl">关联行业：</span><span class="fv">${f.linked_industry||'—'}</span>
      <span class="fl" style="margin-left:16px">个股：</span><span class="fv">${(f.linked_tickers||[]).join(' · ')||'—'}</span>
      <span class="fl" style="margin-left:16px">时间维度：</span><span class="fv">${f.horizon||'—'}</span>
    </div>
    <div class="factor-field"><span class="fl">置信度：</span><span class="confidence-stars" data-id="${id||idx}" data-editable="${editable?1:0}">${stars}</span></div>
    ${advHtml}
    <div class="factor-actions">${actions}</div>
  </div>`;
}

function bindStars(container){
  container.querySelectorAll('.confidence-stars').forEach(el=>{
    el.querySelectorAll('span').forEach(s=>{
      s.addEventListener('click', ()=>{
        const n = parseInt(s.dataset.n);
        const id = el.dataset.id;
        const editable = el.dataset.editable==='1';
        el.querySelectorAll('span').forEach((x,i)=>{x.textContent=i<n?'★':'☆';x.classList.toggle('on',i<n)});
        if(!editable && id) updateFactor(id, {confidence:n});
        else {
          // 更新 pendingFactors
          const idx = parseInt(id);
          if(pendingFactors[idx]) pendingFactors[idx].confidence = n;
        }
      });
    });
  });
}

function bindActions(container){/* status change 和 delete 已内联 */}

function approveIngest(idx){
  if(pendingFactors[idx]) pendingFactors[idx].status = '已采纳';
  const el = document.querySelector(`#fc-${idx}`);
  if(el){el.className=el.className.replace(/status-\S+/,'status-已采纳');el.querySelector('.tag-status').textContent='已采纳';el.querySelector('.tag-status').className='tag tag-status tag-已采纳';}
}
function removeIngest(idx){
  const el = document.querySelector(`#fc-${idx}`);
  if(el) el.remove();
  if(pendingFactors[idx]) pendingFactors.splice(idx,1);
}

async function changeStatus(id, status){
  await updateFactor(id, {status});
  loadFactors();
}
async function updateFactor(id, patch){
  await fetch(API+'/api/factors/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
}
async function deleteFactor(id){
  if(!confirm('确认删除？')) return;
  await fetch(API+'/api/factors/'+id, {method:'DELETE'});
  loadFactors();
}

function updateSidebarFooter(){
  const by = {};
  allFactors.forEach(f=>{ const s=f.status||'候选'; by[s]=(by[s]||0)+1; });
  document.getElementById('sf').textContent = `因子总数 ${allFactors.length} · 已采纳 ${by['已采纳']||0}`;
}

// ── 初始化 ──
loadFactors();
</script>
</body></html>
