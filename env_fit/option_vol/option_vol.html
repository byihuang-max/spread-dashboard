<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>期权卖权环境指数</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#2d3142;padding:20px;font-size:14px}
    .card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid #e8eaef}
    .card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;color:#2d3142}
    .card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .sub{font-size:11px;color:#64748b;margin-top:4px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
    .metric{border-left:3px solid #6366f1;background:#f8fafc;border-radius:10px;padding:14px}
    .metric .k{font-size:11px;color:#64748b;font-weight:600}.metric .v{font-size:22px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
    .metric .s{font-size:10px;color:#94a3b8;margin-top:3px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:8px 10px;border-bottom:1px solid #f3f4f6;text-align:left}
    th{font-size:11px;color:#64748b;background:#f8f9fb;font-weight:600}
    tr:hover td{background:#fafbfc}
    .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
    .green{background:#dcfce7;color:#15803d}.yellow{background:#fef3c7;color:#b45309}.gray{background:#f1f5f9;color:#64748b}.red{background:#fee2e2;color:#dc2626}
    .chart-wrap{position:relative;height:280px;margin-top:12px}
    .tip{font-size:11px;color:#64748b;line-height:1.6;margin-top:8px;padding:10px 14px;background:#f8fafc;border-radius:8px;border:1px solid #e8eaef}
    @media (max-width: 900px){.grid{grid-template-columns:1fr 1fr}}
  </style>
<style id="bb-override" media="not all">
/* === BLOOMBERG TERMINAL OVERRIDE === */
[style*="animation"],[class*="fade"],[class*="slide"]{opacity:1!important;transform:none!important}canvas{opacity:1!important}
:root{--bg:#0a0a0a!important;--card-bg:#0a0a0a!important;--card:#0a0a0a!important;--text:#ccc!important;--text-sub:#888!important;--border:#2a2a2a!important;--accent:#ff8c00!important;--sidebar-active:#ff8c00!important}
html,body{background:#0a0a0a!important;color:#ccc!important;max-width:100%!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
.card,.panel,.module-card,.diag-hero,.metric-card,.factor-card,.info-card,.method-card,.legend-card,.stat-card,.overview-card,.ov-card{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;box-shadow:none!important;color:#ccc!important}
.card-title,.panel-title,.section-title,.module-title,h1,h2,h3,h4,h5,h6,.ov-label{color:#ff8c00!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
p,span,div,li,td,th,label,.ov-value,.stat-value,.metric-value{color:#ccc!important}
table{border-collapse:collapse!important}
table,th,td{border-color:#2a2a2a!important;color:#ccc!important}
th{background:#111!important;color:#ff8c00!important}
tr:nth-child(even) td{background:#0f0f0f!important}
tr:hover td{background:#1a1a1a!important}
button,.btn,.refresh-btn,.tab,.ss-tab,.strat-tab,.nav-tab{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
button:hover,.btn:hover,.tab.active,.ss-tab.active,.strat-tab.active,.nav-tab.active{background:#ff8c00!important;color:#000!important;border-color:#ff8c00!important}
.dot{display:none!important}
canvas{background:transparent!important}
input,select,textarea{background:#1a1a1a!important;border:1px solid #333!important;color:#ccc!important;border-radius:0!important}
a{color:#ff8c00!important}
hr{border-color:#2a2a2a!important}
code,pre{background:#111!important;color:#4caf50!important;border-color:#2a2a2a!important}
.badge,.tag,.chip,.label-tag{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:0}
</style>




<script>
(function(){
  function isBloomberg(){
    try{return window.parent.location.search.includes("theme=bloomberg")}catch(e){return false}
  }
  function registerPlugin(){
    if(typeof Chart==="undefined")return false;
    if(!isBloomberg())return true;
    Chart.defaults.color="#888";
    Chart.defaults.borderColor="#2a2a2a";
    Chart.defaults.font.family="JetBrains Mono,SF Mono,monospace";
    Chart.defaults.plugins.legend.labels.color="#888";
    Chart.defaults.plugins.tooltip.backgroundColor="#1a1a1a";
    Chart.defaults.plugins.tooltip.borderColor="#333";
    Chart.register({
      id:"bloombergGrid",
      afterLayout(chart){
        Object.values(chart.scales).forEach(function(scale){
          if(scale.options.grid){
            if(scale.axis==="x"){
              scale.options.grid.display=false;
            }else{
              scale.options.grid.color="#2a2a2a";
              scale.options.grid.lineWidth=1;
              scale.options.grid.drawTicks=false;
              scale.options.grid.display=true;
            }
          }
          if(scale.options.ticks){
            scale.options.ticks.color="#888";
          }
        });
      }
    });
  }

  // 第三屏：结构拆解图
  const ctx2 = document.getElementById('structureChart');
  if(ctx2 && signal?.history){
    const hist = signal.history;
    new Chart(ctx2, {
      type:'line',
      data:{
        labels: hist.map(x=>fmtDate(x.date)),
        datasets:[
          {
            label:'高 IV 占比 (%)',
            data: hist.map(x=>x.high_iv_ratio),
            borderColor:'#f59e0b',
            backgroundColor:'rgba(245,158,11,0.08)',
            fill:false,
            borderWidth:2,
            tension:0.3,
            pointRadius:0
          },
          {
            label:'高成交额占比 (%)',
            data: hist.map(x=>x.high_amt_ratio),
            borderColor:'#10b981',
            backgroundColor:'rgba(16,185,129,0.08)',
            fill:false,
            borderWidth:2,
            tension:0.3,
            pointRadius:0
          }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#64748b'}}
        },
        scales:{
          y:{min:0,max:100,ticks:{color:'#64748b',font:{size:10},callback:v=>v+'%'}},
          x:{ticks:{color:'#64748b',font:{size:10},maxRotation:0},grid:{display:false}}
        }
      }
    });
  }

  // 第四屏：Top 3 建议品种
  const comp = composite?.mod9_composite_score || composite || {};
  const regime = comp.regime || {};
  const compSymbols = comp.symbols || [];
  const top3 = (regime.top3 || []).map(t => {
    const full = compSymbols.find(s => s.symbol === t.symbol) || t;
    return { ...t, ...full };
  });
  
  const container = document.getElementById('top3Container');
  if(container && top3.length){
    container.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">' +
      top3.map((t,i) => {
        const sig = t.signal || '🟡';
        const label = t.label || '观察';
        const reason = t.reason_text || t.pca_env || '--';
        const score = t.composite_score ?? t.score ?? '--';
        return '<div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#f8fafc">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
            '<span style="font-size:20px">' + sig + '</span>' +
            '<span style="font-size:16px;font-weight:800">' + (t.symbol||'') + '</span>' +
            '<span style="font-size:12px;color:#64748b">' + (t.cn_name||'') + '</span>' +
            '<span style="margin-left:auto;font-size:18px;font-weight:800;color:#6366f1">' + score + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:#64748b;margin-bottom:6px">' + label + '</div>' +
          '<div style="font-size:11px;color:#94a3b8;line-height:1.5">' + reason + '</div>' +
        '</div>';
      }).join('') +
    '</div>';
    
    if(regime.description){
      container.innerHTML += '<div style="margin-top:10px;font-size:12px;color:#64748b;padding:8px 12px;background:#f1f5f9;border-radius:8px">' +
        '<b>市场 Regime：</b>' + (regime.label||'') + ' — ' + regime.description +
        ' | 可卖品种数：' + (regime.n_sellable ?? '--') +
        ' | 平均分：' + (regime.avg_composite_score ?? '--') +
      '</div>';
    }
  }

  // 第五屏：品种综合评分明细（旧版完整保留）
  if(compSymbols.length){
    document.getElementById('compTbody').innerHTML = compSymbols.map(row=>{
      const bd = row.breakdown || {};
      return '<tr>'+
        '<td><b>'+(row.symbol||'')+'</b>'+(row.cn_name?('（'+row.cn_name+'）'):'')+'</td>'+
        '<td>'+(row.signal||'')+' '+(row.label||'')+'</td>'+
        '<td><b>'+fmt(row.composite_score ?? row.sell_score,0)+'</b></td>'+
        '<td>'+fmt(row.rv_score,0)+'</td>'+
        '<td>'+fmt(row.iv_score ?? row.iv_rv_spread_score,0)+'</td>'+
        '<td>'+fmt(row.skew_score,0)+'</td>'+
        '<td>'+fmt(row.term_score,0)+'</td>'+
        '<td>'+fmt(row.liquidity_score,0)+'</td>'+
        '<td>'+fmt(row.expiry_score ?? row.tenor_score,0)+'</td>'+
        '<td style="font-size:11px;color:#64748b;max-width:260px">'+(row.reason_text || row.pca_env || '--')+'</td>'+
      '</tr>';
    }).join('');
  }

  // 第六屏：全品种环境明细
  if(breadth?.symbols){
    const symbols = breadth.symbols.slice(0, 30); // 只显示前30个
    document.getElementById('tbody').innerHTML = symbols.map(row=>{
      return '<tr>'+
        '<td><b>'+(row.symbol||'')+'</b> '+(row.cn_name||'')+'</td>'+
        '<td>'+fmt(row.iv_percentile,1)+'%</td>'+
        '<td>'+fmt(row.amount_percentile,1)+'%</td>'+
        '<td>'+fmt(row.liquidity_percentile,1)+'%</td>'+
        '<td><b>'+fmt(row.sell_env_score,1)+'</b></td>'+
        '<td>'+fmt(row.total_vol,0)+'</td>'+
        '<td>'+fmt(row.total_amount,0)+'</td>'+
        '<td>'+fmt(row.total_oi,0)+'</td>'+
      '</tr>';
    }).join('');
  }

}).catch(err=>{
  document.getElementById('metaLine').textContent='加载失败：'+err;
});
</script>
</body>
</html>
