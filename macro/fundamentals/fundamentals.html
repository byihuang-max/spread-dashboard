<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经济基本面</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#2d3142;padding:20px;font-size:14px}
.section{margin-bottom:28px}
.signal-bar{background:linear-gradient(135deg,#1e2433,#2a3350);border-radius:12px;padding:16px 20px;color:#e2e6ed;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.signal-main{font-size:18px;font-weight:800}
.signal-tags{display:flex;gap:8px;flex-wrap:wrap}
.signal-tag{background:rgba(255,255,255,0.1);padding:4px 12px;border-radius:20px;font-size:12px;color:#b8bfce}
.signal-tag.good{background:rgba(34,197,94,0.2);color:#4ade80}
.signal-tag.risk{background:rgba(239,68,68,0.2);color:#f87171}
.signal-tag.warn{background:rgba(245,158,11,0.25);color:#fbbf24}
.clock-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e8eaef;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.clock-phase{font-size:36px;font-weight:900}
.clock-info{flex:1}
.clock-info .phase-name{font-size:18px;font-weight:800;margin-bottom:4px}
.clock-info .phase-advice{font-size:13px;color:#6b7280}
.clock-info .phase-data{font-size:12px;color:#8b92a5;margin-top:6px}
.hypothesis-card{background:linear-gradient(135deg,#ffffff,#fbfcff);border:1px solid #e8eaef;border-radius:14px;padding:18px 20px;margin-bottom:20px;box-shadow:0 1px 2px rgba(15,23,42,0.03);scroll-margin-top:18px}
.hypothesis-card:target{border-color:rgba(245,158,11,.75);box-shadow:0 0 0 4px rgba(245,158,11,.14),0 8px 24px rgba(245,158,11,.16);animation:hypothesisPulse 1.2s ease 1}
@keyframes hypothesisPulse{0%{transform:scale(.995)}35%{transform:scale(1.006)}100%{transform:scale(1)}}
.hypothesis-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.hypothesis-title{font-size:20px;font-weight:800;color:#111827}
.hypothesis-summary{font-size:13px;color:#4b5563;line-height:1.8;margin-top:6px;max-width:820px}
.hypothesis-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hypothesis-badge{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
.hypothesis-badge.conf-high{background:#dcfce7;color:#166534}
.hypothesis-badge.conf-mid{background:#fef3c7;color:#92400e}
.hypothesis-badge.conf-low{background:#fee2e2;color:#991b1b}
.hypothesis-badge.note{background:#eef2ff;color:#4338ca;font-weight:600}
.hypothesis-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.h-card{background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:14px}
.h-card-title{font-size:13px;font-weight:800;color:#111827;margin-bottom:10px}
.h-list{display:flex;flex-direction:column;gap:8px}
.h-item{font-size:13px;line-height:1.8;color:#374151}
.chain-list{display:flex;flex-direction:column;gap:10px}
.chain-item{background:#fff;border:1px solid #eef2f7;border-radius:10px;padding:12px}
.chain-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.chain-name{font-size:13px;font-weight:800;color:#111827}
.chain-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.chain-status.support{background:#dcfce7;color:#166534}
.chain-status.neutral{background:#fef3c7;color:#92400e}
.chain-status.reject{background:#fee2e2;color:#991b1b}
.chain-desc{font-size:12px;color:#4b5563;line-height:1.8}
.chain-data{font-size:11px;color:#94a3b8;margin-top:6px}
.chart-box{background:#fff;border-radius:10px;padding:16px;border:1px solid #e8eaef;margin-bottom:16px}
.chart-box h3{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px}
.chart-wrap{position:relative;height:280px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.hypothesis-grid,.chart-row{grid-template-columns:1fr}}
.chart-note{font-size:11px;color:#8b92a5;line-height:1.7;margin-top:10px;padding:10px 12px;background:#f9fafb;border-radius:6px}
.chart-note b{color:#374151}
.status-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:700;margin-left:8px}
.status-badge.good{background:rgba(34,197,94,.14);color:#166534}.status-badge.warn{background:rgba(245,158,11,.18);color:#92400e}.status-badge.risk{background:rgba(239,68,68,.14);color:#991b1b}.status-badge.info{background:rgba(59,130,246,.12);color:#1d4ed8}
.sub-summary{font-size:11px;color:#8b92a5;margin:-2px 0 10px 0;line-height:1.7}
.metric-strip{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px 0}.metric-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#f8fafc;border:1px solid #e5e7eb;font-size:11px;color:#4b5563}.metric-chip b{color:#111827}
.loading{text-align:center;padding:60px;color:#8b92a5}
</style>
<style id="bb-override" media="not all">
/* === BLOOMBERG TERMINAL OVERRIDE === */
[style*="animation"],[class*="fade"],[class*="slide"]{opacity:1!important;transform:none!important}canvas{opacity:1!important}
:root{--bg:#0a0a0a!important;--card-bg:#0a0a0a!important;--card:#0a0a0a!important;--text:#ccc!important;--text-sub:#888!important;--border:#2a2a2a!important;--accent:#ff8c00!important;--sidebar-active:#ff8c00!important}
html,body{background:#0a0a0a!important;color:#ccc!important;max-width:100%!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
.card,.panel,.module-card,.diag-hero,.metric-card,.factor-card,.info-card,.method-card,.legend-card,.stat-card,.overview-card,.ov-card{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;box-shadow:none!important;color:#ccc!important}
.card-title,.panel-title,.section-title,.module-title,h1,h2,h3,h4,h5,h6,.ov-label{color:#ff8c00!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
p,span,div,li,td,th,label,.ov-value,.stat-value,.metric-value{color:#ccc!important}
table{border-collapse:collapse!important}
table,th,td{border-color:#2a2a2a!important;color:#ccc!important}
th{background:#111!important;color:#ff8c00!important}
tr:nth-child(even) td{background:#0f0f0f!important}
tr:hover td{background:#1a1a1a!important}
button,.btn,.refresh-btn,.tab,.ss-tab,.strat-tab,.nav-tab{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
button:hover,.btn:hover,.tab.active,.ss-tab.active,.strat-tab.active,.nav-tab.active{background:#ff8c00!important;color:#000!important;border-color:#ff8c00!important}
.dot{display:none!important}
canvas{background:transparent!important}
input,select,textarea{background:#1a1a1a!important;border:1px solid #333!important;color:#ccc!important;border-radius:0!important}
a{color:#ff8c00!important}
hr{border-color:#2a2a2a!important}
code,pre{background:#111!important;color:#4caf50!important;border-color:#2a2a2a!important}
.badge,.tag,.chip,.label-tag{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:0}
</style>




<script>
(function(){
  function isBloomberg(){
    try{return window.parent.location.search.includes("theme=bloomberg")}catch(e){return false}
  }
  function registerPlugin(){
    if(typeof Chart==="undefined")return false;
    if(!isBloomberg())return true;
    Chart.defaults.color="#888";
    Chart.defaults.borderColor="#2a2a2a";
    Chart.defaults.font.family="JetBrains Mono,SF Mono,monospace";
    Chart.defaults.plugins.legend.labels.color="#888";
    Chart.defaults.plugins.tooltip.backgroundColor="#1a1a1a";
    Chart.defaults.plugins.tooltip.borderColor="#333";
    Chart.register({
      id:"bloombergGrid",
      afterLayout(chart){
        Object.values(chart.scales).forEach(function(scale){
          if(scale.options.grid){
            if(scale.axis==="x"){
              scale.options.grid.display=false;
            }else{
              scale.options.grid.color="#2a2a2a";
              scale.options.grid.lineWidth=1;
              scale.options.grid.drawTicks=false;
              scale.options.grid.display=true;
            }
          }
          if(scale.options.ticks){
            scale.options.ticks.color="#888";
          }
        });
      });
    })
    .catch(function(e){console.error('加载利润周期数据失败:',e)});
}
function renderDemandRecovery(){
  fetch('profit_cycle/profit_cycle.json?t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(data){
      if(!data.history||!data.history.length)return;
      var d=data.history.slice(-36);
      new Chart(document.getElementById('demandRecoveryChart'),{type:'line',
        data:{labels:d.map(function(x){return String(x.date).substring(0,4)+'-'+String(x.date).substring(4,6)}),
          datasets:[
            {label:'内需接棒得分',data:d.map(function(x){return x.demand_recovery_score}),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',fill:true,borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
            {label:'M1-M2剪刀差',data:d.map(function(x){return x.m1_m2_scissors}),borderColor:'#06b6d4',borderWidth:1.5,tension:0.3,pointRadius:0,borderDash:[4,4],yAxisID:'y1'}
          ]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
          plugins:{legend:{position:'top',labels:{font:{size:11}}}},
          scales:{
            y:{position:'left',title:{display:true,text:'得分(0-100)',font:{size:10}},grid:{color:'#f0f0f0'},min:0,max:100},
            y1:{position:'right',title:{display:true,text:'M1-M2剪刀差%',font:{size:10}},grid:{display:false}},
            x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}
          }}
      });
    })
    .catch(function(e){console.error('加载内需接棒数据失败:',e)});
}

function monthLabel(v){ var m=String(v).replace('.0',''); return m.substring(0,4)+'-'+m.substring(4,6); }
function renderGrowthBreakdown(){
  var d=(DATA.growth_breakdown||{}).series||[]; if(!d.length)return;
  var box=DATA.growth_breakdown||{};
  setStatus('growthStatus', box.status||'');
  document.getElementById('growthSummary').textContent=box.summary||'';
  var latest=box.latest||{};
  renderMetricStrip('growthMetrics', [
    {label:'工业', value:fmtNum(latest.industrial_production_yoy)+'%'},
    {label:'消费', value:fmtNum(latest.retail_sales_yoy)+'%'},
    {label:'出口', value:fmtNum(latest.exports_yoy)+'%'},
    {label:'固投', value:fmtNum(latest.fai_ytd_yoy)+'%'}
  ]);
  new Chart(document.getElementById('growthChart'),{type:'line',data:{labels:d.map(x=>monthLabel(x.month)),datasets:[
    {label:'工业增加值',data:d.map(x=>x.industrial_production_yoy),borderColor:'#2563eb',borderWidth:2,tension:0.3,pointRadius:0},
    {label:'社零',data:d.map(x=>x.retail_sales_yoy),borderColor:'#f97316',borderWidth:2,tension:0.3,pointRadius:0},
    {label:'出口',data:d.map(x=>x.exports_yoy),borderColor:'#10b981',borderWidth:2,tension:0.3,pointRadius:0},
    {label:'固投',data:d.map(x=>x.fai_ytd_yoy),borderColor:'#8b5cf6',borderWidth:2,tension:0.3,pointRadius:0}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{grid:{color:'#f0f0f0'}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}});
}
function renderCreditStructure(){
  var d=(DATA.credit_structure||{}).series||[]; if(!d.length)return;
  var box=DATA.credit_structure||{};
  setStatus('creditStatus', box.status||'');
  document.getElementById('creditSummary').textContent=box.summary||'';
  var latest=box.latest||{};
  renderMetricStrip('creditMetrics', [
    {label:'社融同比', value:fmtNum(latest.tsf_stock_yoy)+'%'},
    {label:'政府债占比', value:fmtNum(latest.gov_bond_share_in_tsf)+'%'},
    {label:'企业中长贷', value:fmtWanYi(latest.corp_medium_long_loan)+'万亿'},
    {label:'居民中长贷', value:fmtWanYi(latest.household_medium_long_loan)+'万亿'},
    {label:'贷款流量', value:fmtWanYi(latest.tsf_rmb_loan_flow)+'万亿'}
  ]);
  new Chart(document.getElementById('creditChart'),{data:{labels:d.map(x=>monthLabel(x.month)),datasets:[
    {type:'line',label:'社融存量同比',data:d.map(x=>x.tsf_stock_yoy),borderColor:'#2563eb',borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
    {type:'bar',label:'政府债占比',data:d.map(x=>x.gov_bond_share_in_tsf),backgroundColor:'rgba(249,115,22,0.35)',borderColor:'#f97316',borderWidth:1,yAxisID:'y'},
    {type:'line',label:'企业中长贷',data:d.map(x=>x.corp_medium_long_loan),borderColor:'#10b981',borderWidth:1.8,tension:0.3,pointRadius:0,yAxisID:'y1'},
    {type:'line',label:'居民中长贷',data:d.map(x=>x.household_medium_long_loan),borderColor:'#8b5cf6',borderWidth:1.8,tension:0.3,pointRadius:0,yAxisID:'y1'}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{position:'left',grid:{color:'#f0f0f0'}},y1:{position:'right',grid:{display:false}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}});
}
function renderPropertyRecovery(){
  var d=(DATA.property_recovery||{}).series||[]; if(!d.length)return;
  d=d.map(function(x){
    return Object.assign({tsf_rmb_loan_flow:null}, x);
  });
  var box=DATA.property_recovery||{};
  setStatus('propertyStatus', box.status||'');
  document.getElementById('propertySummary').textContent=box.summary||'';
  var latest=box.latest||{};
  renderMetricStrip('propertyMetrics', [
    {label:'销售面积', value:fmtNum(latest.property_sales_area_yoy)+'%'},
    {label:'地产投资', value:fmtNum(latest.real_estate_investment_ytd_yoy)+'%'},
    {label:'新开工', value:fmtNum(latest.housing_starts_ytd_yoy)+'%'},
    {label:'竣工', value:fmtNum(latest.housing_completion_ytd_yoy)+'%'}
  ]);
  new Chart(document.getElementById('propertyChart'),{data:{labels:d.map(x=>monthLabel(x.month)),datasets:[
    {type:'line',label:'销售面积同比',data:d.map(x=>x.property_sales_area_yoy),borderColor:'#dc2626',borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
    {type:'line',label:'地产投资同比',data:d.map(x=>x.real_estate_investment_ytd_yoy),borderColor:'#2563eb',borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
    {type:'line',label:'居民中长贷',data:d.map(x=>x.household_medium_long_loan),borderColor:'#10b981',borderWidth:1.8,tension:0.3,pointRadius:0,yAxisID:'y1'},
    {type:'bar',label:'人民币贷款流量',data:d.map(x=>x.tsf_rmb_loan_flow),backgroundColor:'rgba(6,182,212,0.20)',borderColor:'#06b6d4',borderWidth:1,yAxisID:'y1'}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{position:'left',grid:{color:'#f0f0f0'}},y1:{position:'right',grid:{display:false}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}});
}


function renderInventoryCycle(){
  var d=(DATA.inventory_cycle||{}).series||[]; if(!d.length)return;
  var box=DATA.inventory_cycle||{};
  setStatus('inventoryStatus', box.status||'');
  document.getElementById('inventorySummary').textContent=box.summary||'';
  var latest=box.latest||{};
  renderMetricStrip('inventoryMetrics', [
    {label:'产成品库存', value:fmtNum(latest.finished_goods_inventory_yoy)+'%'},
    {label:'工业利润', value:fmtNum(latest.industrial_profit_ytd_yoy)+'%'},
    {label:'PPI', value:fmtNum(latest.ppi_yoy_proxy)+'%'},
    {label:'PMI产成品库存', value:fmtNum(latest.pmi_finished_goods_inventory)}
  ]);
  new Chart(document.getElementById('inventoryChart'),{data:{labels:d.map(x=>monthLabel(x.month)),datasets:[
    {type:'line',label:'产成品库存同比',data:d.map(x=>x.finished_goods_inventory_yoy),borderColor:'#2563eb',borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
    {type:'line',label:'工业利润累计同比',data:d.map(x=>x.industrial_profit_ytd_yoy),borderColor:'#dc2626',borderWidth:2,tension:0.3,pointRadius:0,yAxisID:'y'},
    {type:'line',label:'PMI产成品库存',data:d.map(x=>x.pmi_finished_goods_inventory),borderColor:'#10b981',borderWidth:1.8,tension:0.3,pointRadius:0,yAxisID:'y1'},
    {type:'line',label:'PMI原材料库存',data:d.map(x=>x.pmi_raw_material_inventory),borderColor:'#8b5cf6',borderWidth:1.8,tension:0.3,pointRadius:0,yAxisID:'y1'},
    {type:'line',label:'PPI同比',data:d.map(x=>x.ppi_yoy_proxy),borderColor:'#f59e0b',borderWidth:1.5,tension:0.3,pointRadius:0,borderDash:[4,4],yAxisID:'y'}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{position:'left',grid:{color:'#f0f0f0'}},y1:{position:'right',grid:{display:false}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}});
}

loadData();
</script>
</body></html>
