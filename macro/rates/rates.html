<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全球利率与汇率</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6f8;--card-bg:#fff;--text:#2d3142;--text-sub:#8b92a5;--border:#e8eaef;--accent:#ff8c00;--grid-color:#f0f0f0;--note-bg:#f9fafb;--signal-bg:#f8f9fa;--tag-bg:rgba(0,0,0,0.05);--tag-text:#5a6070}
html.bb-dark{--bg:#0a0a0a;--card-bg:#0a0a0a;--text:#ccc;--text-sub:#888;--border:#2a2a2a;--accent:#ff8c00;--grid-color:#222;--note-bg:#111;--signal-bg:#0f0f0f;--tag-bg:rgba(255,255,255,0.06);--tag-text:#888}
body{font-family:'JetBrains Mono',SF Mono,monospace;background:var(--bg);color:var(--text);padding:20px;font-size:14px;transition:background .35s ease,color .35s ease}
.section{margin-bottom:28px}
.signal-bar{background:var(--signal-bg);border:1px solid var(--border);border-left:3px solid var(--accent);padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.signal-main{font-size:18px;font-weight:800;color:var(--accent)}
.signal-tags{display:flex;gap:8px;flex-wrap:wrap}
.signal-tag{background:var(--tag-bg);padding:4px 12px;border-radius:4px;font-size:12px;color:var(--tag-text)}
.signal-tag.good{background:rgba(34,197,94,0.15);color:#16a34a}
.signal-tag.risk{background:rgba(239,68,68,0.15);color:#dc2626}
.signal-tag.warn{background:rgba(245,158,11,0.15);color:#d97706}
html.bb-dark .signal-tag.good{background:rgba(34,197,94,0.2);color:#4ade80}
html.bb-dark .signal-tag.risk{background:rgba(239,68,68,0.2);color:#f87171}
html.bb-dark .signal-tag.warn{background:rgba(245,158,11,0.25);color:#fbbf24}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.s-card{background:var(--card-bg);padding:14px;border:1px solid var(--border);border-left:3px solid var(--accent);text-align:center}
.s-card .s-label{font-size:11px;color:var(--text-sub);font-weight:600;margin-bottom:6px}
.s-card .s-value{font-size:22px;font-weight:800;color:var(--text)}
.s-card .s-sub{font-size:11px;color:var(--text-sub);margin-top:4px}
.chart-box{background:var(--card-bg);padding:16px;border:1px solid var(--border);border-left:3px solid var(--accent);margin-bottom:16px}
.chart-box h3{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px}
.chart-wrap{position:relative;height:260px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}}
.chart-note{font-size:11px;color:var(--text-sub);line-height:1.7;margin-top:10px;padding:10px 12px;background:var(--note-bg);border:1px solid var(--border)}
.chart-note b{color:var(--text)}
.loading{text-align:center;padding:60px;color:var(--text-sub)}
</style>
<style id="bb-scrollbar">
html.bb-dark ::-webkit-scrollbar{width:6px;height:6px}
html.bb-dark ::-webkit-scrollbar-track{background:#0a0a0a}
html.bb-dark ::-webkit-scrollbar-thumb{background:#333}
</style>




<script>
(function(){
  /* Chart.js theme plugin - reads CSS variables, no hardcoded colors */
  function getVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
  function isDark(){return document.documentElement.classList.contains("bb-dark");}
  function registerPlugin(){
    if(typeof Chart==="undefined")return false;
    Chart.defaults.font.family="JetBrains Mono,SF Mono,monospace";
    Chart.register({
      id:"themeGrid",
      afterLayout:function(chart){
        var textSub=isDark()?"#888":"#8b92a5";
        var gridColor=isDark()?"#222":"#f0f0f0";
        Object.values(chart.scales).forEach(function(scale){
          if(scale.options.grid){scale.options.grid.color=gridColor;}
          if(scale.options.ticks){scale.options.ticks.color=textSub;}
        });
      }
    });
    return true;
  }
  if(!registerPlugin()){
    var tries=0;
    var iv=setInterval(function(){tries++;if(registerPlugin()||tries>50)clearInterval(iv);},50);
  }
})();
</script>
<script>
/* Bootstrap: detect mode from parent, set class, listen for switches */
(function(){
  var _mode="dark";
  try{_mode=window.parent.__bbMode||window.parent.localStorage.getItem("bbMode")||"dark";}catch(e){}
  window.__bbMode=_mode;
  if(_mode!=="light"){
    document.documentElement.classList.add("bb-dark");
  }
  /* Listen for theme toggle from parent */
  window.addEventListener("message",function(e){
    if(!e.data||e.data.type!=="bb-theme")return;
    var m=e.data.mode;
    window.__bbMode=m;
    if(m==="light"){
      document.documentElement.classList.remove("bb-dark");
    }else{
      document.documentElement.classList.add("bb-dark");
    }
    /* Update existing charts */
    if(typeof Chart!=="undefined"){
      Object.values(Chart.instances||{}).forEach(function(c){try{c.update();}catch(_e){}});
    }
  });
})();
</script>
</head>
<body>
<div class="loading" id="loadingMsg">加载中...</div>
<div id="app" style="display:none">

<div class="signal-bar">
  <div class="signal-main">全球利率与汇率</div>
  <div class="signal-tags" id="signalTags"></div>
  <div style="margin-left:auto;font-size:11px;color:#7c8598" id="updateTime"></div>
</div>

<div class="summary-cards" id="summaryCards"></div>

<div class="chart-row section">
  <div class="chart-box">
    <h3> 中国10Y vs 美国10Y国债收益率</h3>
    <div class="chart-wrap"><canvas id="yieldChart"></canvas></div>
    <div class="chart-note">
      <b>中国10Y：</b>国内无风险利率基准，影响股债估值中枢。下行=宽松预期，利好成长股。<br>
      <b>美国10Y：</b>全球资产定价之锚。上行=全球流动性收紧，新兴市场承压。
    </div>
  </div>
  <div class="chart-box">
    <h3> 中美利差（中10Y - 美10Y）</h3>
    <div class="chart-wrap"><canvas id="spreadChart"></canvas></div>
    <div class="chart-note">
      <b>中美利差 = 中国10Y - 美国10Y。</b><br>
      <b>利差为负：</b>中国利率低于美国，资金有外流压力（北向可能流出、人民币有贬值压力）。<br>
      <b>利差收窄/转正：</b>中国利率优势回升，外资回流动力增强。<br>
      <b>关键阈值：</b>< -1.5% 压力较大，> -0.5% 压力缓解。
    </div>
  </div>
</div>

</div>
<script>
var DATA;
function loadData(){
  fetch('rates.json?t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(d){DATA=d;render()})
    .catch(function(e){document.getElementById('loadingMsg').textContent='加载失败: '+e.message})
}
function render(){
  document.getElementById('loadingMsg').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('updateTime').textContent='更新: '+(DATA.update_time||'');
  var sigs=DATA.signals||[];
  document.getElementById('signalTags').innerHTML=sigs.map(function(s){
    var cls='signal-tag';
    if(s.indexOf('🟢')>=0) cls+=' good';
    else if(s.indexOf('🔴')>=0) cls+=' risk';
    else if(s.indexOf('⚠')>=0) cls+=' warn';
    return '<span class="'+cls+'">'+s+'</span>';
  }).join('');

  // 摘要卡片
  var html='';
  var cn=DATA.cn10y||[];
  var us=DATA.us10y||[];
  var sp=DATA.spread||[];
  if(cn.length) html+='<div class="s-card"><div class="s-label">中国10Y</div><div class="s-value">'+cn[cn.length-1].value.toFixed(2)+'%</div></div>';
  if(us.length) html+='<div class="s-card"><div class="s-label">美国10Y</div><div class="s-value">'+us[us.length-1].value.toFixed(2)+'%</div></div>';
  if(sp.length) html+='<div class="s-card"><div class="s-label">中美利差</div><div class="s-value" style="color:'+(sp[sp.length-1].spread<-1?'#dc2626':'#16a34a')+'">'+(sp[sp.length-1].spread>0?'+':'')+sp[sp.length-1].spread.toFixed(2)+'%</div></div>';
  var fx=DATA.fx||{};
  if(fx['USDCNY.FX']&&fx['USDCNY.FX'].latest) html+='<div class="s-card"><div class="s-label">USDCNY</div><div class="s-value">'+fx['USDCNY.FX'].latest.toFixed(4)+'</div></div>';
  if(fx['USDCNH.FX']&&fx['USDCNH.FX'].latest) html+='<div class="s-card"><div class="s-label">USDCNH</div><div class="s-value">'+fx['USDCNH.FX'].latest.toFixed(4)+'</div></div>';
  if(DATA.fx_spread!=null) html+='<div class="s-card"><div class="s-label">在岸离岸价差</div><div class="s-value">'+(DATA.fx_spread*1000).toFixed(0)+'点</div></div>';
  document.getElementById('summaryCards').innerHTML=html;

  renderYieldChart();
  renderSpreadChart();
}
function renderYieldChart(){
  var cn=DATA.cn10y||[];
  var us=DATA.us10y||[];
  if(!cn.length&&!us.length)return;
  // 用较长的那个做labels
  var labels=(cn.length>=us.length?cn:us).map(function(d){return d.date});
  var datasets=[];
  if(cn.length) datasets.push({label:'中国10Y %',data:cn.map(function(d){return d.value}),borderColor:'#dc2626',borderWidth:2,tension:0.3,pointRadius:0});
  if(us.length) datasets.push({label:'美国10Y %',data:us.map(function(d){return d.value}),borderColor:'#2563eb',borderWidth:2,tension:0.3,pointRadius:0});
  new Chart(document.getElementById('yieldChart'),{type:'line',
    data:{labels:labels,datasets:datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{font:{size:11}}}},
      scales:{y:{},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}
  });
}
function renderSpreadChart(){
  var sp=DATA.spread||[];
  if(!sp.length)return;
  new Chart(document.getElementById('spreadChart'),{type:'line',
    data:{labels:sp.map(function(d){return d.date}),
      datasets:[{label:'中美利差 %',data:sp.map(function(d){return d.spread}),
        borderColor:'#6366f1',backgroundColor:sp.map(function(d){return d.spread>0?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.2)'}),
        fill:true,tension:0.3,borderWidth:2,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,font:{size:10}}}}}
  });
}
loadData();
</script>
</body></html>
