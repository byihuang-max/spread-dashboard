<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>红灯预警</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#2d3142;padding:16px;font-size:14px}

.header-bar{background:linear-gradient(135deg,#1e2433,#2a3350);border-radius:12px;padding:18px 22px;color:#e2e6ed;margin-bottom:18px}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-title{font-size:20px;font-weight:900}
.composite{display:flex;align-items:center;gap:12px}
.composite-score{font-size:28px;font-weight:900}
.composite-bar{width:200px;height:10px;background:rgba(255,255,255,0.15);border-radius:5px;overflow:hidden}
.composite-fill{height:100%;border-radius:5px;transition:width .5s}
.composite-label{font-size:12px;font-weight:700}

.alert-list{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.alert-item{font-size:12px;color:#fbbf24;padding:2px 0}

.dim-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.dim-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.dim-grid{grid-template-columns:repeat(2,1fr)}}

.dim-card{background:#fff;border-radius:10px;border:1px solid #e8eaef;padding:14px;text-align:center;transition:all .2s}
.dim-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.dim-emoji{font-size:28px;margin-bottom:6px}
.dim-name{font-size:12px;font-weight:700;color:#374151;margin-bottom:4px}
.dim-score-bar{width:100%;height:6px;background:#f0f0f0;border-radius:3px;margin-bottom:6px;overflow:hidden}
.dim-score-fill{height:100%;border-radius:3px}
.dim-score-text{font-size:18px;font-weight:900}
.dim-items{margin-top:8px;text-align:left}
.dim-items li{font-size:11px;color:#6b7280;line-height:1.6;list-style:none}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr}}
.chart-box{background:#fff;border-radius:10px;padding:14px;border:1px solid #e8eaef}
.chart-box h3{font-size:12px;font-weight:700;color:#374151;margin-bottom:10px}
.chart-wrap{position:relative;height:240px}

.chart-note{font-size:11px;color:#8b92a5;line-height:1.7;padding:12px 14px;background:#fff;border-radius:10px;border:1px solid #e8eaef}
.chart-note b{color:#374151}

.loading{text-align:center;padding:60px;color:#8b92a5}

.tab-bar{display:flex;gap:8px;margin-bottom:18px;background:#fff;padding:8px;border-radius:10px;border:1px solid #e8eaef}
.tab-btn{flex:1;padding:10px 20px;border:none;background:transparent;color:#6b7280;font-size:14px;font-weight:600;border-radius:6px;cursor:pointer;transition:all .2s}
.tab-btn:hover{background:#f3f4f6}
.tab-btn.active{background:linear-gradient(135deg,#1e2433,#2a3350);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}

.indicator-note{font-size:10px;color:#6b7280;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}

.us-indicator-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.us-indicator-header h3{margin:0}
.us-indicator-meta{display:flex;align-items:center;gap:8px;font-size:12px}
.us-indicator-value{font-weight:900;font-size:16px}
.us-indicator-change{color:#6b7280;font-size:11px}

</style>
<style id="bb-override" media="not all">
/* === BLOOMBERG TERMINAL OVERRIDE === */
[style*="animation"],[class*="fade"],[class*="slide"]{opacity:1!important;transform:none!important}canvas{opacity:1!important}
:root{--bg:#0a0a0a!important;--card-bg:#0a0a0a!important;--card:#0a0a0a!important;--text:#ccc!important;--text-sub:#888!important;--border:#2a2a2a!important;--accent:#ff8c00!important;--sidebar-active:#ff8c00!important}
html,body{background:#0a0a0a!important;color:#ccc!important;max-width:100%!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
.card,.panel,.module-card,.diag-hero,.metric-card,.factor-card,.info-card,.method-card,.legend-card,.stat-card,.overview-card,.ov-card{background:#0a0a0a!important;border:1px solid #2a2a2a!important;border-radius:0!important;box-shadow:none!important;color:#ccc!important}
.card-title,.panel-title,.section-title,.module-title,h1,h2,h3,h4,h5,h6,.ov-label{color:#ff8c00!important;font-family:'JetBrains Mono',SF Mono,monospace!important}
p,span,div,li,td,th,label,.ov-value,.stat-value,.metric-value{color:#ccc!important}
table{border-collapse:collapse!important}
table,th,td{border-color:#2a2a2a!important;color:#ccc!important}
th{background:#111!important;color:#ff8c00!important}
tr:nth-child(even) td{background:#0f0f0f!important}
tr:hover td{background:#1a1a1a!important}
button,.btn,.refresh-btn,.tab,.ss-tab,.strat-tab,.nav-tab{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
button:hover,.btn:hover,.tab.active,.ss-tab.active,.strat-tab.active,.nav-tab.active{background:#ff8c00!important;color:#000!important;border-color:#ff8c00!important}
.dot{display:none!important}
canvas{background:transparent!important}
input,select,textarea{background:#1a1a1a!important;border:1px solid #333!important;color:#ccc!important;border-radius:0!important}
a{color:#ff8c00!important}
hr{border-color:#2a2a2a!important}
code,pre{background:#111!important;color:#4caf50!important;border-color:#2a2a2a!important}
.badge,.tag,.chip,.label-tag{background:#1a1a1a!important;border:1px solid #333!important;color:#888!important;border-radius:0!important}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:0}
</style>




<script>
(function(){
  function isBloomberg(){
    try{return window.parent.location.search.includes("theme=bloomberg")}catch(e){return false}
  }
  function registerPlugin(){
    if(typeof Chart==="undefined")return false;
    if(!isBloomberg())return true;
    Chart.defaults.color="#888";
    Chart.defaults.borderColor="#2a2a2a";
    Chart.defaults.font.family="JetBrains Mono,SF Mono,monospace";
    Chart.defaults.plugins.legend.labels.color="#888";
    Chart.defaults.plugins.tooltip.backgroundColor="#1a1a1a";
    Chart.defaults.plugins.tooltip.borderColor="#333";
    Chart.register({
      id:"bloombergGrid",
      afterLayout(chart){
        Object.values(chart.scales).forEach(function(scale){
          if(scale.options.grid){
            if(scale.axis==="x"){
              scale.options.grid.display=false;
            }else{
              scale.options.grid.color="#2a2a2a";
              scale.options.grid.lineWidth=1;
              scale.options.grid.drawTicks=false;
              scale.options.grid.display=true;
            }
          }
          if(scale.options.ticks){
            scale.options.ticks.color="#888";
          }
        });
      };
    });
    
    new Chart(document.getElementById(cfg.id),{
      type:'line',
      data:{
        labels:cfg.data.map(function(h){return h.date}),
        datasets:[{
          data:cfg.data.map(function(h){return h.value}),
          borderColor:cfg.levelColor,
          borderWidth:2,pointRadius:0,tension:0.3,fill:false
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},annotation:{annotations:annotations}},
        scales:{
          y:{grid:{color:'#f0f0f0'},ticks:{font:{size:9}}},
          x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{size:9}}}
        }
      }
    });
  });
}

loadData();
</script>
</body></html>
