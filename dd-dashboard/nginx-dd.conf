# DD Dashboard - 静态文件 serve（不再需要 Node.js proxy）
# 添加到 Nginx gamt server block 中，替换原来的 proxy_pass 到 3088

# 替换原来的:
#   location /dd/ {
#       proxy_pass http://127.0.0.1:3088/;
#       ...
#   }
#
# 改为:
#   location /dd/ {
#       alias /home/ubuntu/gamt-dashboard/dd-dashboard/;
#       index index.html;
#       try_files $uri $uri/ /dd/index.html;
#   }
#
# /api/dd/* 请求已经被 /api/ 规则覆盖，自动 proxy 到 Python 9876
# 上传文件通过 /dd/uploads/ 访问（alias 自动覆盖）
