# Nginx location block for DD Dashboard
# Add this inside the server block of /etc/nginx/sites-enabled/gamt-cn
# or the Cloudflare Tunnel config (port 9876 server block)

# Reverse proxy /dd/ to Node.js DD Dashboard on port 3088
location /dd/ {
    proxy_pass http://127.0.0.1:3088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Also handle /dd without trailing slash
location = /dd {
    return 301 /dd/;
}
